services:
  slot-machine:
    build: .
    container_name: slot-machine-v3
    environment:
      - DISPLAY=${DISPLAY:-host.docker.internal:0} # Adjust for Windows X-Server (VcXsrv/Xming)
    volumes:
      - .:/app
      # To persist just the save file if not mounting the whole app:
      # - ./Slot-machine version 3/save_game.json:/app/Slot-machine version 3/save_game.json
    network_mode: host # Often needed for X11 connection to host
    stdin_open: true
    tty: true
